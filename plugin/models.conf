# The model and the effort of each agent, in both tools, and the only place
# to change them.
# To change one: edit its line, then run `sh scripts/set-models.sh`.
# Never edit the model or effort lines in plugin/agents/*.md by hand, nor any
# file in opencode/agents/: that folder is generated.
#
# model and effort are for Claude Code. opencode-model is provider/model, and
# opencode-variant is what opencode calls the effort.
#
# agent    model    effort    opencode-model        opencode-variant
explore    haiku    medium    openai/gpt-6-luna     medium
write      sonnet   medium    openai/gpt-6.1-sol    medium
review     opus     high      openai/gpt-6.1-sol    high
