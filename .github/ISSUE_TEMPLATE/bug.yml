name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw. Include exact error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool and version
      placeholder: Claude Code 2.x / opencode 2.3.0
    validations:
      required: true
